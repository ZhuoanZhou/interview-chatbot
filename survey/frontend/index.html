<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Communication experiences survey</title>
  <link rel="stylesheet" href="survey.css">
</head>
<body>
  <main id="survey" aria-label="Communication experiences survey">
    <header><div class="eyebrow">COMMUNICATION EXPERIENCES</div><div id="section"></div><div class="progress" aria-hidden="true"><div id="progress"></div></div></header>
    <div id="save-status" class="hidden" role="status" aria-live="polite"></div>
    <section id="question-panel" aria-label="Current survey question">
      <article id="page" tabindex="0" aria-label="Survey question and answers"><div id="page-content"></div></article>
      <div id="scroll-cue" class="hidden">
        <button id="scroll-more" type="button" aria-controls="page">Show more below <span aria-hidden="true">↓</span></button>
      </div>
    </section>
    <div id="controls">
      <nav id="navigation" aria-label="Survey navigation"></nav>
      <footer id="footer"></footer>
    </div>
  </main>
  <script src="survey.js"></script>
</body>
</html>
